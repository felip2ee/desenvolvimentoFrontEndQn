<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
        <p class="subtitulo">
            Organize seus estudos e acompanhe suas atividades acadêmicas.
        </p>
    </header>

    <main>

        <section class="area-filtros" aria-labelledby="titulo-filtros">

            <h2 id="titulo-filtros">Busca e filtros</h2>

            <form>

                <div class="campo-busca">
                    <label for="busca-tarefa">Buscar tarefa por título</label>

                    <input type="search" id="busca-tarefa" name="busca" placeholder="Digite o título da tarefa">
                </div>

                <fieldset>
                    <legend>Status</legend>

                    <span class="opcao-filtro">
                        <input
                            type="radio"
                            id="status-todos"
                            name="status"
                            value="todos"
                            checked
                        >
                        <label for="status-todos">Todos</label>
                    </span>

                    <span class="opcao-filtro">
                        <input
                            type="radio"
                            id="status-fazer"
                            name="status"
                            value="a-fazer"
                        >
                        <label for="status-fazer">A fazer</label>
                    </span>

                    <span class="opcao-filtro">
                        <input
                            type="radio"
                            id="status-andamento"
                            name="status"
                            value="em-andamento"
                        >
                        <label for="status-andamento">
                            Em andamento
                        </label>
                    </span>

                    <span class="opcao-filtro">
                        <input
                            type="radio"
                            id="status-revisao"
                            name="status"
                            value="em-revisao"
                        >
                        <label for="status-revisao">
                            Em revisão
                        </label>
                    </span>

                    <span class="opcao-filtro">
                        <input
                            type="radio"
                            id="status-concluida"
                            name="status"
                            value="concluida"
                        >
                        <label for="status-concluida">
                            Concluída
                        </label>
                    </span>

                </fieldset>

                <fieldset>
                    <legend>Prioridade</legend>

                    <span class="opcao-filtro">
                        <input
                            type="radio"
                            id="prioridade-todas"
                            name="prioridade"
                            value="todas"
                            checked
                        >
                        <label for="prioridade-todas">Todas</label>
                    </span>

                    <span class="opcao-filtro">
                        <input
                            type="radio"
                            id="prioridade-baixa"
                            name="prioridade"
                            value="baixa"
                        >
                        <label for="prioridade-baixa">Baixa</label>
                    </span>

                    <span class="opcao-filtro">
                        <input
                            type="radio"
                            id="prioridade-media"
                            name="prioridade"
                            value="media"
                        >
                        <label for="prioridade-media">Média</label>
                    </span>

                    <span class="opcao-filtro">
                        <input
                            type="radio"
                            id="prioridade-alta"
                            name="prioridade"
                            value="alta"
                        >
                        <label for="prioridade-alta">Alta</label>
                    </span>

                </fieldset>

            </form>

        </section>

        <p data-estado role="status" aria-live="polite"></p>

        <section class="titulo-quadro" aria-labelledby="titulo-quadro" data-quadro>

            <h2 id="titulo-quadro">Quadro de tarefas</h2>


            <section class="coluna-status" aria-labelledby="titulo-a-fazer">
                <h3 id="titulo-a-fazer">A fazer</h3>
                    
                <ul data-lista-status="a-fazer"></ul>

            </section>


            <section class="coluna-status" aria-labelledby="titulo-em-andamento">
                <h3 id="titulo-em-andamento">Em andamento</h3>

                <ul data-lista-status="em-andamento"></ul>

            </section>


            <section class="coluna-status" aria-labelledby="titulo-em-revisao">
                <h3 id="titulo-em-revisao">Em revisão</h3>

                <ul data-lista-status="em-revisao"></ul>

            </section>


            <section class="coluna-status" aria-labelledby="titulo-concluida">
                <h3 id="titulo-concluida">Concluída</h3>

                <ul data-lista-status="concluida"></ul>

            </section>

        </section>

    </main>


    <footer>
        <p>
            Felipe · Desenvolvimento Frontend · 2026.2
        </p>
    </footer>

</body>
</html>
